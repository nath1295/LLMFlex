[project]
name = "llmflex"
description = "A python package for developing AI applications with local LLMs."
dynamic = ["version"]

authors = [
    {name = "Nathan Tam", email = "nathan1295@gmail.com"},
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "torch",
    "transformers>=4.35.0",
    "openai>=1.0.0",
    "tiktoken"
]

[project.urls]
Homepage = "https://github.com/nath1295/LLMFlex"

[project.scripts]
llmflex = "llmflex.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.dynamic]
version = {attr = "llmflex.__version__"}

[tool.setuptools.packages.find]
where = ["src"]